services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_trading_world}
      POSTGRES_USER: ${POSTGRES_USER:-ai_trading_world}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-demo-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-ai_trading_world}
      POSTGRES_USER: ${POSTGRES_USER:-ai_trading_world}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:-fixture}
      MARKET_DATA_TTL_SECONDS: ${MARKET_DATA_TTL_SECONDS:-300}
      MARKET_DATA_HTTP_TIMEOUT_SECONDS: ${MARKET_DATA_HTTP_TIMEOUT_SECONDS:-8}
      MARKET_DATA_MIN_REQUEST_INTERVAL_SECONDS: ${MARKET_DATA_MIN_REQUEST_INTERVAL_SECONDS:-2}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-gpt-6-astra}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-25}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
      ANALYSIS_MAX_ATTEMPTS: ${ANALYSIS_MAX_ATTEMPTS:-3}
      ANALYSIS_SOFT_TIME_LIMIT_SECONDS: ${ANALYSIS_SOFT_TIME_LIMIT_SECONDS:-75}
      ANALYSIS_HARD_TIME_LIMIT_SECONDS: ${ANALYSIS_HARD_TIME_LIMIT_SECONDS:-90}
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-demo-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-ai_trading_world}
      POSTGRES_USER: ${POSTGRES_USER:-ai_trading_world}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:-fixture}
      MARKET_DATA_TTL_SECONDS: ${MARKET_DATA_TTL_SECONDS:-300}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-gpt-6-astra}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-25}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1200}
      ANALYSIS_MAX_ATTEMPTS: ${ANALYSIS_MAX_ATTEMPTS:-3}
    command: celery -A config worker --loglevel=INFO --concurrency=2
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    command: npm run dev -- --host 0.0.0.0
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:

